# DVC pipeline

stages:
  data_generation:
    cmd: python 0_synthetic_Data.py
    deps:
      - 0_synthetic_Data.py
      - dependancies/params_utils.py
    params:
      - dependancies/params.yaml:
          - data_generation
    outs:
      - input/synthetic_fashion_demand.csv
      - input/synthetic_fashion_demand_full.csv

  featurize:
    cmd: python 2_Features.py
    deps:
      - 2_Features.py
      - dependancies/params_utils.py
      - dependancies/Features_Functions.py
      - input/synthetic_fashion_demand.csv
    params:
      - dependancies/params.yaml:
          - features
    outs:
      - input/synthetic_fashion_demand_features.csv
      - input/train_features.csv
      - input/val_features.csv
      - input/test_features.csv

  train_baseline:
    cmd: python 4_baseline_model.py
    deps:
      - 4_baseline_model.py
      - dependancies/Features_Functions.py
      - dependancies/Metrics_Functions.py
      - dependancies/params_utils.py
      - input/train_features.csv
      - input/val_features.csv
      - input/test_features.csv
    params:
      - dependancies/params.yaml:
          - baseline_model
          - features
    outs:
      - Output/Models/baseline_lightgbm.txt
    metrics:
      - Output/Metrics/metrics_baseline.json:
          cache: false   # small + human-readable -- keep it a plain git-diffable file

  segment_algo_tuning:
    cmd: python 6_optuna_tuning.py
    deps:
      - 6_optuna_tuning.py
      - dependancies/Features_Functions.py
      - dependancies/Metrics_Functions.py
      - dependancies/params_utils.py
      - dependancies/Segment_Algo_Functions.py
      - input/train_features.csv
      - input/val_features.csv
    params:
      - dependancies/params.yaml:
          - tuning
          - features
    outs:
      - segment_algo_selection.json


  evaluate_segment_ensemble:
    cmd: python 7_tuned_vs_baseline_segments.py
    deps:
      - 7_tuned_vs_baseline_segments.py
      - dependancies/Features_Functions.py
      - dependancies/Metrics_Functions.py
      - dependancies/params_utils.py
      - dependancies/Segment_Algo_Functions.py
      - segment_algo_selection.json
      - optuna_best_params.json
      - input/train_features.csv
      - input/val_features.csv
      - input/test_features.csv
    params:
      - dependancies/params.yaml:
          - baseline_model
          - features
          - tuning
    outs:
      - output/Models/tuned_lightgbm.txt
      - output/Models/baseline_lightgbm_rerun.txt
      - tuned_vs_baseline_segments.csv
      - segment_ensemble_report.csv
    metrics:
      - metrics_segment_ensemble.json:
          cache: false